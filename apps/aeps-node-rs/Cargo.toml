[package]
name = "aeps-node"
version = "0.1.0"
edition = "2021"
description = "AEPS — Agent Evidence and Payment Standard. Rust reference implementation."
license = "MIT"
repository = "https://github.com/proofoftrust21/satrank"
documentation = "https://docs.rs/aeps-node"
keywords = ["aeps", "lightning", "bitcoin", "agent", "evidence"]
categories = ["network-programming", "cryptography"]
readme = "README.md"
rust-version = "1.75"

[lib]
name = "aeps_node"
path = "src/lib.rs"

[dependencies]
# Cryptography — RFC 6962 Merkle, Ed25519 receipts, secp256k1 Nostr keys.
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
secp256k1 = { version = "0.29", features = ["recovery", "global-context"] }
hex = "0.4"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
rand = "0.8"
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
