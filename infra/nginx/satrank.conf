# SatRank V3 nginx config.
#
# Public path: Internet -> nginx (443) -> Express (127.0.0.1:3000)
#
# Express handles everything:
#   - L402 paid gate (POST /api/intent + POST /api/deposit)
#   - Static landing page (GET /)
#   - Free reads (services/*, oracle/budget, deposit/:id, .well-known/*)
#
# nginx is a thin TLS terminator + security-header injector. No path-specific
# locations — Express owns the routing table. The two CORS-relaxed locations
# below are the only exceptions.
#
# Deploy:
#
#     sudo cp infra/nginx/satrank.conf /etc/nginx/sites-enabled/satrank
#     sudo nginx -t && sudo systemctl reload nginx
#
# Drift policy: this file is the source of truth. Any prod edit that diverges
# is a drift; the next repo-deploy silently reverts it.

server {
    listen 80;
    server_name satrank.dev api.satrank.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name satrank.dev api.satrank.dev;

    ssl_certificate /etc/letsencrypt/live/satrank.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/satrank.dev/privkey.pem;

    # TLS hardening: TLS 1.2/1.3 only, modern ciphers, server-chosen order.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Body size cap.
    # V3 endpoints have small bodies: /api/intent ~512B, /api/deposit ~50B,
    # everything else has no body. Express caps at 64KB; nginx at 16KB is
    # tighter (defense-in-depth). 16KB still leaves 32x headroom on real bodies.
    client_max_body_size 16k;
    client_body_buffer_size 16k;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # NIP-05 verification for the SatRank Nostr identity.
    # Wide-open CORS so any Nostr client can fetch it cross-origin.
    location /.well-known/nostr.json {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin * always;
    }

    # Static images (favicon, og-image, etc.). CORS open for embed-friendliness.
    location ~* \.(png|jpg|jpeg|ico|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
    }

    # Catch-all: every other path -> Express.
    # This single location replaces 6+ V1-era explicit locations
    # (/api/agent, /api/decide, /api/best-route, /api/profile/, /api/verdicts,
    # /api/report) that no longer exist in V3.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
