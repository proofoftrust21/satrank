# Smithery.ai server configuration for SatRank MCP.
# https://smithery.ai/server/proofoftrust21/satrank

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - SATRANK_API_BASE
    properties:
      SATRANK_API_BASE:
        type: string
        title: SatRank API base URL
        description: |
          Hosted SatRank API endpoint. Default https://satrank.dev for the
          public oracle ; override with http://localhost:3000 if you run a
          self-hosted SatRank instance.
        default: https://satrank.dev
      DATABASE_URL:
        type: string
        title: Postgres URL (optional, only when self-hosting SatRank)
        description: |
          Connection string for a local Postgres instance. The hosted MCP
          path does not need this — every read goes through SATRANK_API_BASE.
        default: ""
  commandFunction: |
    (config) => ({
      command: "node",
      args: ["dist/mcp/server.js"],
      env: {
        SATRANK_API_BASE: config.SATRANK_API_BASE,
        ...(config.DATABASE_URL ? { DATABASE_URL: config.DATABASE_URL } : {})
      }
    })

build:
  dockerfile: Dockerfile.mcp
